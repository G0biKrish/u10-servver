version: '3.8'
services:
  postgres:
    image: postgres:14-alpine
    container_name: u10-postgres
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_USER=nakama
      - POSTGRES_PASSWORD=local_db_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nakama} -d $${POSTGRES_DB:-nakama}"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.22.0
    container_name: u10-nakama
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - "/nakama/nakama migrate up --database.address nakama:local_db_pass@postgres:5432/nakama?sslmode=disable && exec /nakama/nakama --database.address nakama:local_db_pass@postgres:5432/nakama?sslmode=disable --logger.level info --session.token_expiry_sec 7200 --runtime.js_entrypoint index.js --socket.server_key ChickenThokkuBriyani"
    restart: always
    links:
      - postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama_modules:/nakama/data/modules
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
