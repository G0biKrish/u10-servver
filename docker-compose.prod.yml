version: '3.8'
services:
  postgres:
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always

  nakama:
    image: heroiclabs/nakama:3.22.0
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up --database.address "${DATABASE_URL}" &&
        exec /nakama/nakama
        --database.address "${DATABASE_URL}"
        --runtime.js_entrypoint index.js
        --logger.level info
        --session.token_expiry_sec 7200
        --console.username "${CONSOLE_USERNAME:-admin}"
        --console.password "${CONSOLE_PASSWORD:-password}"
        --runtime.env "CONSOLE_USERNAME=${CONSOLE_USERNAME:-admin}"
        --runtime.env "CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-password}"
        --socket.server_key "${SERVER_KEY:-defaultkey}"
    volumes:
      - ./nakama_modules:/nakama/data/modules
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    restart: always
    env_file:
      - .env
